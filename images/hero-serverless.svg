<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <linearGradient id="blue-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background card rounded -->
  <rect width="640" height="400" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="520" y1="0" x2="520" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
  </g>

  <!-- Connections / Bus Lines -->
  <path d="M120 120 C180 120, 180 200, 240 200" stroke="#4cc9f0" stroke-width="2.5" stroke-dasharray="6 4" stroke-opacity="0.7"/>
  <path d="M120 200 L240 200" stroke="#00f5d4" stroke-width="2.5" stroke-dasharray="6 4" stroke-opacity="0.9"/>
  <path d="M120 280 C180 280, 180 200, 240 200" stroke="#7b2cbf" stroke-width="2.5" stroke-dasharray="6 4" stroke-opacity="0.7"/>

  <path d="M340 200 C370 200, 370 120, 420 120" stroke="#4cc9f0" stroke-width="2.5" stroke-opacity="0.8"/>
  <path d="M340 200 L420 200" stroke="#00f5d4" stroke-width="2.5" stroke-opacity="0.8"/>
  <path d="M340 200 C370 200, 370 280, 420 280" stroke="#7b2cbf" stroke-width="2.5" stroke-opacity="0.8"/>

  <path d="M490 120 L530 120" stroke="#4cc9f0" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M490 200 L530 200" stroke="#00f5d4" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M490 280 L530 280" stroke="#7b2cbf" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Left: Event Sources (Clients / HTTP / IoT) -->
  <g transform="translate(40, 95)">
    <rect width="80" height="50" rx="8" fill="#1b2a47" stroke="#4cc9f0" stroke-width="1.5"/>
    <text x="40" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HTTP Client</text>
    <text x="40" y="38" fill="#a0aec0" font-family="'Inter', system-ui, sans-serif" font-size="9" text-anchor="middle">REST / GraphQL</text>
  </g>

  <g transform="translate(40, 175)">
    <rect width="80" height="50" rx="8" fill="#1b2a47" stroke="#00f5d4" stroke-width="1.5"/>
    <text x="40" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Event / Cron</text>
    <text x="40" y="38" fill="#a0aec0" font-family="'Inter', system-ui, sans-serif" font-size="9" text-anchor="middle">Timer / Queue</text>
  </g>

  <g transform="translate(40, 255)">
    <rect width="80" height="50" rx="8" fill="#1b2a47" stroke="#7b2cbf" stroke-width="1.5"/>
    <text x="40" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Storage Event</text>
    <text x="40" y="38" fill="#a0aec0" font-family="'Inter', system-ui, sans-serif" font-size="9" text-anchor="middle">S3 / Upload</text>
  </g>

  <!-- Middle 1: API Gateway / Event Router -->
  <g transform="translate(220, 155)">
    <rect width="120" height="90" rx="12" fill="#13223f" stroke="#00f5d4" stroke-width="2" filter="url(#soft-glow)"/>
    <rect width="120" height="90" rx="12" fill="#13223f" stroke="#00f5d4" stroke-width="2"/>
    <circle cx="60" cy="32" r="16" fill="#00f5d4" fill-opacity="0.15"/>
    <path d="M52 32h16M60 24v16" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="62" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">API Gateway</text>
    <text x="60" y="76" fill="#00f5d4" font-family="'Inter', system-ui, sans-serif" font-size="10" text-anchor="middle">Event Router &amp; Auth</text>
  </g>

  <!-- Middle 2: Serverless Functions (Lambda / FaaS Instances) -->
  <g transform="translate(410, 95)">
    <rect width="80" height="50" rx="8" fill="#201a42" stroke="#4cc9f0" stroke-width="1.5"/>
    <text x="22" y="32" fill="#4cc9f0" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="bold">λ</text>
    <text x="48" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">AuthFn</text>
    <text x="48" y="38" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="9">Node.js</text>
  </g>

  <g transform="translate(410, 175)">
    <rect width="80" height="50" rx="8" fill="#201a42" stroke="#00f5d4" stroke-width="2"/>
    <text x="22" y="32" fill="#00f5d4" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="bold">λ</text>
    <text x="48" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">OrderFn</text>
    <text x="48" y="38" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="9">Python</text>
  </g>

  <g transform="translate(410, 255)">
    <rect width="80" height="50" rx="8" fill="#201a42" stroke="#7b2cbf" stroke-width="1.5"/>
    <text x="22" y="32" fill="#7b2cbf" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="bold">λ</text>
    <text x="48" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">ImageFn</text>
    <text x="48" y="38" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="9">Go / Rust</text>
  </g>

  <!-- Right: Managed BaaS Services -->
  <g transform="translate(530, 95)">
    <rect width="75" height="50" rx="8" fill="#1b2a47" stroke="#4cc9f0" stroke-width="1.2"/>
    <text x="37" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Serverless DB</text>
    <text x="37" y="38" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="9" text-anchor="middle">DynamoDB / YDB</text>
  </g>

  <g transform="translate(530, 175)">
    <rect width="75" height="50" rx="8" fill="#1b2a47" stroke="#00f5d4" stroke-width="1.2"/>
    <text x="37" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Event Stream</text>
    <text x="37" y="38" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="9" text-anchor="middle">Kafka / SQS</text>
  </g>

  <g transform="translate(530, 255)">
    <rect width="75" height="50" rx="8" fill="#1b2a47" stroke="#7b2cbf" stroke-width="1.2"/>
    <text x="37" y="24" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Object Store</text>
    <text x="37" y="38" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="9" text-anchor="middle">S3 / Buckets</text>
  </g>

  <!-- Bottom Stats Badge inside SVG -->
  <g transform="translate(140, 345)">
    <rect width="360" height="36" rx="18" fill="#10192e" stroke="#3a7bd5" stroke-width="1"/>
    <circle cx="25" cy="18" r="5" fill="#00f5d4"/>
    <text x="180" y="23" fill="#cbd5e1" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">
      Автомасштабирование: от 0 до тысяч экземпляров за миллисекунды
    </text>
  </g>
</svg>
