<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="card-grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Left: Traditional Server Card -->
  <g transform="translate(20, 20)">
    <rect width="315" height="320" rx="14" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="315" height="48" rx="14" fill="#334155" fill-opacity="0.4"/>
    <circle cx="28" cy="24" r="8" fill="#ef4444" fill-opacity="0.2"/>
    <circle cx="28" cy="24" r="4" fill="#ef4444"/>
    <text x="46" y="29" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700">Традиционный сервер (VM)</text>

    <!-- Visual: 24/7 Running Server Box with idle waste -->
    <g transform="translate(25, 65)">
      <rect width="265" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="20" y="28" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="11">Загрузка CPU: 12% (простой 88%)</text>
      <!-- Progress Bar (mostly idle) -->
      <rect x="20" y="40" width="225" height="12" rx="6" fill="#334155"/>
      <rect x="20" y="40" width="30" height="12" rx="6" fill="#ef4444"/>
      <text x="20" y="70" fill="#f87171" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600">Оплата 24/7, даже при нуле трафика</text>
    </g>

    <!-- Points list -->
    <g transform="translate(25, 175)" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#cbd5e1">
      <circle cx="6" cy="8" r="3" fill="#ef4444"/>
      <text x="18" y="12">Ручное администрирование ОС и патчи</text>
      <circle cx="6" cy="38" r="3" fill="#ef4444"/>
      <text x="18" y="42">Медленное масштабирование (минуты)</text>
      <circle cx="6" cy="68" r="3" fill="#ef4444"/>
      <text x="18" y="72">Постоянная фиксированная плата</text>
      <circle cx="6" cy="98" r="3" fill="#ef4444"/>
      <text x="18" y="102">Ограниченная отказоустойчивость</text>
    </g>
  </g>

  <!-- Right: Serverless Architecture Card -->
  <g transform="translate(365, 20)">
    <rect width="315" height="320" rx="14" fill="url(#card-grad-2)" stroke="#7b2cbf" stroke-width="1.8"/>
    <rect x="0" y="0" width="315" height="48" rx="14" fill="#7b2cbf" fill-opacity="0.2"/>
    <circle cx="28" cy="24" r="8" fill="#00f5d4" fill-opacity="0.2"/>
    <circle cx="28" cy="24" r="4" fill="#00f5d4"/>
    <text x="46" y="29" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700">Бессерверная модель (FaaS)</text>

    <!-- Visual: On-demand Micro-execution -->
    <g transform="translate(25, 65)">
      <rect width="265" height="85" rx="8" fill="#131b2e" stroke="#00f5d4" stroke-width="1"/>
      <text x="20" y="28" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="11">Запуск только при наличии события</text>
      <!-- Activity pulses -->
      <g transform="translate(20, 38)">
        <rect x="0" y="0" width="22" height="16" rx="4" fill="#00f5d4"/>
        <rect x="35" y="0" width="22" height="16" rx="4" fill="#00f5d4"/>
        <rect x="70" y="0" width="45" height="16" rx="4" fill="#7b2cbf"/>
        <rect x="130" y="0" width="22" height="16" rx="4" fill="#00f5d4"/>
      </g>
      <text x="20" y="72" fill="#00f5d4" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600">0 вызовов = ровно 0 рублей</text>
    </g>

    <!-- Points list -->
    <g transform="translate(25, 175)" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#cbd5e1">
      <circle cx="6" cy="8" r="3" fill="#00f5d4"/>
      <text x="18" y="12">Инфраструктура полностью скрыта</text>
      <circle cx="6" cy="38" r="3" fill="#00f5d4"/>
      <text x="18" y="42">Мгновенное автомасштабирование (мс)</text>
      <circle cx="6" cy="68" r="3" fill="#00f5d4"/>
      <text x="18" y="72">Посекундная тарификация за такт CPU</text>
      <circle cx="6" cy="98" r="3" fill="#00f5d4"/>
      <text x="18" y="102">Встроенная высокая доступность</text>
    </g>
  </g>
</svg>
